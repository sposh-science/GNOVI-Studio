name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # Detects, for pull_request events only, whether every changed file
  # belongs to a category that cannot affect application behaviour (docs,
  # githooks/, LICENSE, CITATION.cff, the Authorship Review workflow
  # itself). If so, the expensive platform test matrix below is skipped
  # for THIS PR -- push-to-main and workflow_dispatch are always left at
  # matrix_required=true, so `main` always gets full validation regardless
  # of what any individual PR's CI ran. Deliberately conservative: any
  # file outside the safe list, any unknown/new path, and any mixed PR
  # containing even one non-safe file all resolve to matrix_required=true.
  #
  # Reads the PR's changed-file list from the GitHub API (gh, preinstalled
  # on hosted runners) rather than a local `git diff`, so the result does
  # not depend on checkout depth. No checkout is performed by this job.
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      matrix_required: ${{ steps.classify.outputs.matrix_required }}
    steps:
      - name: Classify this PR's changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Safe-to-skip: docs, githooks/, repo metadata, and the
          # Authorship Review workflow itself. Everything else defaults to
          # requiring the matrix -- this is an allowlist of what may be
          # skipped, never a list of what must run.
          is_safe_path() {
            case "$1" in
              *.md) return 0 ;;
              docs/*) return 0 ;;
              githooks/*) return 0 ;;
              LICENSE) return 0 ;;
              CITATION.cff) return 0 ;;
              .github/workflows/authorship-integrity.yml) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull_request event (${{ github.event_name }}) -- full matrix"
            echo "matrix_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[] | .filename, (.previous_filename // empty)')

          if [ -z "$files" ]; then
            echo "no changed-file data returned -- failing safe to full matrix"
            echo "matrix_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if is_safe_path "$f"; then
              echo "  safe:   $f"
            else
              echo "  unsafe: $f"
              required=true
            fi
          done <<< "$files"

          echo "matrix_required=$required" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed-file classification"
            echo ""
            echo "\`matrix_required=$required\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.name }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux — PyPI Stack (Ubuntu)
          - os: windows-latest
            name: Windows — PyPI Stack
    runs-on: ${{ matrix.os }}
    steps:
      # Every step below is individually gated on matrix_required, rather
      # than putting `if:` on the job itself. A job-level `if:` on a
      # matrix job whose `name:` interpolates ${{ matrix.* }} has
      # documented, inconsistent GitHub Actions behaviour for the
      # per-leg check names when skipped (the matrix may not expand, or
      # may not carry its intended name) -- see actions/runner#952 and
      # actions/runner#2675. Gating every step instead leaves the job
      # itself, and its matrix expansion into the two named checks below,
      # completely unaffected: both legs always run, always keep their
      # usual name, and resolve in a few seconds with every step showing
      # "skipped" and the job showing success when the matrix isn't
      # required. test-fedora/test-debian have static names and no
      # matrix, so they use a plain job-level `if:` instead (see below).
      - uses: actions/checkout@v4
        if: needs.changes.outputs.matrix_required == 'true'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.matrix_required == 'true'
        with:
          python-version: "3.12"

      - name: Upgrade pip
        if: needs.changes.outputs.matrix_required == 'true'
        run: python -m pip install --upgrade pip

      - name: Install GNOVI + test dependencies
        if: needs.changes.outputs.matrix_required == 'true'
        run: pip install -e ".[test,xrd]"

      - name: Install Qt runtime libraries (Ubuntu)
        if: needs.changes.outputs.matrix_required == 'true' && matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Run tests (Ubuntu, with coverage)
        if: needs.changes.outputs.matrix_required == 'true' && matrix.os == 'ubuntu-latest'
        run: pytest --cov=gnovi_plot --cov-report=term-missing --cov-report=xml

      - name: Run tests (Windows)
        if: needs.changes.outputs.matrix_required == 'true' && matrix.os == 'windows-latest'
        run: pytest

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.matrix_required == 'true' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        # No CODECOV_TOKEN configured yet -- this step is intentionally
        # non-blocking (fail_ci_if_error: false) so a Codecov upload issue
        # never fails an otherwise-green pytest run. See PR description for
        # the external setup step this needs.

  test-fedora:
    name: Linux — PyPI Stack (Fedora Container)
    needs: changes
    if: needs.changes.outputs.matrix_required == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      # Fedora 44's default `python3` is 3.14. This job intentionally installs
      # the versioned python3.12 package instead, so this first Fedora
      # portability job tests "GNOVI on a second Linux distribution" without
      # also introducing an untested Python version at the same time.
      - name: Install Python 3.12 and Qt runtime libraries (Fedora)
        run: |
          dnf install -y python3.12 mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs

      - name: Install GNOVI + test dependencies
        run: |
          python3.12 -m ensurepip --upgrade
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -e ".[test,xrd]"

      - name: Verify headless Qt import/startup
        run: |
          python3.12 -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print('QApplication created OK:', app)
          "

      - name: Run tests (Fedora)
        run: python3.12 -m pytest

  test-debian:
    name: Linux — Debian System Stack
    needs: changes
    if: needs.changes.outputs.matrix_required == 'true'
    # Upstream compatibility check against Debian's OWN packaged Python /
    # scientific / Qt stack -- NOT PyPI wheels. The other jobs `pip install`
    # NumPy/SciPy/Matplotlib/PySide6, whose wheels bundle their own FreeType,
    # OpenBLAS and Qt, so distro/system-library differences are invisible to
    # them. This job exercises: system FreeType + Matplotlib text metrics,
    # distro NumPy/SciPy/BLAS, distro Qt6/PySide6, Debian's Python version,
    # and the valid absence of the optional `pybaselines` dependency (not
    # packaged in Debian).
    #
    # It is NOT Debian package CI: it builds no .deb and does not run
    # lintian / sbuild / autopkgtest / piuparts. The Debian Science Team
    # maintains the actual packaging on Salsa; this only tests the same
    # upstream source tree the other jobs test, against apt-provided libs.
    runs-on: ubuntu-latest
    # A hung test must not wedge the runner for the 6 h GitHub default.
    timeout-minutes: 35
    container:
      image: debian:trixie-slim
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: /tmp/mplconfig
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:*-slim ships no git; actions/checkout needs it for a real
      # clone (otherwise it silently falls back to a REST tarball).
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install GNOVI's dependencies from Debian (apt, no PyPI wheels)
        run: |
          apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-timeout \
            python3-numpy python3-scipy python3-pandas python3-matplotlib \
            python3-sympy python3-pil \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            qt6-qpa-plugins \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 \
            fonts-dejavu-core
          # `pybaselines` (the `xrd` extra) is deliberately NOT installed:
          # it is not in Debian, and its absence is part of what this job
          # verifies. GNOVI's arPLS tests skip cleanly without it.

      - name: Show the stack under test (every scientific/Qt lib is from Debian)
        run: |
          python3 - <<'PY'
          import sys, numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL
          import matplotlib.ft2font as ft
          print("python    ", sys.version.replace("\n", " "))
          for m in (numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL):
              print(f"  {m.__name__:11s} {getattr(m, '__version__', '?'):14s} {getattr(m, '__file__', '')}")
          print("  Matplotlib links FreeType", ft.__freetype_version__)
          try:
              import pybaselines  # noqa: F401
              print("  pybaselines PRESENT -- unexpected on Debian")
          except ImportError:
              print("  pybaselines absent (expected: optional 'xrd' extra, not in Debian)")
          # Guard against a PyPI wheel sneaking in: every core lib must load
          # from the system dist-packages, not a pip site-packages tree.
          not_distro = [
              m.__name__ for m in (numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL)
              if "/usr/lib/python3" not in (getattr(m, "__file__", "") or "")
          ]
          assert not not_distro, f"not from a Debian package: {not_distro}"
          PY

      - name: Headless Qt import/startup smoke
        run: |
          python3 -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print('QApplication created OK on platform:', app.platformName())
          "

      - name: Run the test suite against the Debian stack
        env:
          PYTHONPATH: ${{ github.workspace }}
        # `--timeout` turns a wedged test (e.g. an unstubbed modal dialog
        # under the offscreen platform) into a failure with a traceback
        # instead of letting it hang the job; `-rs` lists the skip reasons
        # (the pybaselines skips are part of what this job checks).
        run: python3 -m pytest -q -rs --timeout=300
