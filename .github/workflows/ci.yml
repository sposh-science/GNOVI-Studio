name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install GNOVI + test dependencies
        run: pip install -e ".[test,xrd]"

      - name: Install Qt runtime libraries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Run tests (Ubuntu, with coverage)
        if: matrix.os == 'ubuntu-latest'
        run: pytest --cov=gnovi_plot --cov-report=term-missing --cov-report=xml

      - name: Windows Qt/geometry diagnostics (temporary, PR #2 investigation)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python scripts/_windows_qt_diagnostics.py

      - name: Windows Qt/geometry diagnostics with offscreen size= override (temporary)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen:size=1920x1080
        run: python scripts/_windows_qt_diagnostics.py

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: pytest

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        # No CODECOV_TOKEN configured yet -- this step is intentionally
        # non-blocking (fail_ci_if_error: false) so a Codecov upload issue
        # never fails an otherwise-green pytest run. See PR description for
        # the external setup step this needs.

  test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      # Fedora 44's default `python3` is 3.14. This job intentionally installs
      # the versioned python3.12 package instead, so this first Fedora
      # portability job tests "GNOVI on a second Linux distribution" without
      # also introducing an untested Python version at the same time.
      - name: Install Python 3.12 and Qt runtime libraries (Fedora)
        run: |
          dnf install -y python3.12 mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs

      - name: Install GNOVI + test dependencies
        run: |
          python3.12 -m ensurepip --upgrade
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install -e ".[test,xrd]"

      - name: Verify headless Qt import/startup
        run: |
          python3.12 -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print('QApplication created OK:', app)
          "

      - name: Run tests (Fedora)
        run: python3.12 -m pytest

  test-debian:
    # Upstream compatibility check against Debian's OWN packaged Python /
    # scientific / Qt stack -- NOT PyPI wheels. The other jobs `pip install`
    # NumPy/SciPy/Matplotlib/PySide6, whose wheels bundle their own FreeType,
    # OpenBLAS and Qt, so distro/system-library differences are invisible to
    # them. This job exercises: system FreeType + Matplotlib text metrics,
    # distro NumPy/SciPy/BLAS, distro Qt6/PySide6, Debian's Python version,
    # and the valid absence of the optional `pybaselines` dependency (not
    # packaged in Debian).
    #
    # It is NOT Debian package CI: it builds no .deb and does not run
    # lintian / sbuild / autopkgtest / piuparts. The Debian Science Team
    # maintains the actual packaging on Salsa; this only tests the same
    # upstream source tree the other jobs test, against apt-provided libs.
    #
    # `continue-on-error` until the first GitHub Actions run is confirmed
    # green (it could not be validated in a container locally). Once green,
    # drop `continue-on-error` to make it a normal blocking job.
    runs-on: ubuntu-latest
    continue-on-error: true
    # Safety net while the job is still being characterised: a hung test
    # must not wedge the runner for the 6 h GitHub default.
    timeout-minutes: 35
    container:
      image: debian:trixie-slim
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: /tmp/mplconfig
      DEBIAN_FRONTEND: noninteractive
    steps:
      # debian:*-slim ships no git; actions/checkout needs it for a real
      # clone (otherwise it silently falls back to a REST tarball).
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install GNOVI's dependencies from Debian (apt, no PyPI wheels)
        run: |
          apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-timeout \
            python3-numpy python3-scipy python3-pandas python3-matplotlib \
            python3-sympy python3-pil \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            qt6-qpa-plugins \
            libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 \
            fonts-dejavu-core
          # `pybaselines` (the `xrd` extra) is deliberately NOT installed:
          # it is not in Debian, and its absence is part of what this job
          # verifies. GNOVI's arPLS tests skip cleanly without it.

      - name: Show the stack under test (every scientific/Qt lib is from Debian)
        run: |
          python3 - <<'PY'
          import sys, numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL
          import matplotlib.ft2font as ft
          print("python    ", sys.version.replace("\n", " "))
          for m in (numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL):
              print(f"  {m.__name__:11s} {getattr(m, '__version__', '?'):14s} {getattr(m, '__file__', '')}")
          print("  Matplotlib links FreeType", ft.__freetype_version__)
          try:
              import pybaselines  # noqa: F401
              print("  pybaselines PRESENT -- unexpected on Debian")
          except ImportError:
              print("  pybaselines absent (expected: optional 'xrd' extra, not in Debian)")
          # Guard against a PyPI wheel sneaking in: every core lib must load
          # from the system dist-packages, not a pip site-packages tree.
          not_distro = [
              m.__name__ for m in (numpy, scipy, matplotlib, pandas, sympy, PySide6, PIL)
              if "/usr/lib/python3" not in (getattr(m, "__file__", "") or "")
          ]
          assert not not_distro, f"not from a Debian package: {not_distro}"
          PY

      - name: Headless Qt import/startup smoke
        run: |
          python3 -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print('QApplication created OK on platform:', app.platformName())
          "

      - name: Run the test suite against the Debian stack
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        # Diagnostic settings while the job is being characterised:
        #  -v / unbuffered  -> the running test name is live in the log
        #  -rA              -> full outcome + failure-reason summary
        #  --timeout=300    -> a wedged test (e.g. an unstubbed modal
        #                      dialog under the offscreen platform) is
        #                      turned into a failure with a traceback
        #                      instead of hanging the job
        run: python3 -m pytest -v -rA --timeout=300
