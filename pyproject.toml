[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnovi-plot"
version = "0.9.0"
description = "GNOVI Studio -- Scientific Plotting & Visualization"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Praveen Patil" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "PySide6",
    "matplotlib",
    "numpy",
    "pandas",
    "sympy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
build = ["pyinstaller"]
# arPLS baseline correction (gnovi_plot.modules.xrd.preprocessing.arpls_baseline)
# only -- everything else in modules.xrd runs on the already-core NumPy/
# SciPy/pandas stack. Kept as its own extra rather than core so a basic
# GNOVI install stays lightweight; its absence is detected at call time
# and raises a clear PybaselinesNotAvailableError, never breaks startup.
xrd = ["pybaselines"]

[project.urls]
Homepage = "https://github.com/sposh-science/GNOVI-Studio"
Repository = "https://github.com/sposh-science/GNOVI-Studio"
Issues = "https://github.com/sposh-science/GNOVI-Studio/issues"

# GUI launcher: `gnovi-studio` starts the desktop application
# (gnovi_plot.app.main). Uses gui-scripts so the Windows wrapper is a
# windowed executable with no console; on Linux/macOS it is a plain script.
[project.gui-scripts]
gnovi-studio = "gnovi_plot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["gnovi_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
