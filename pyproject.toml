[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnovi-plot"
version = "0.9.0"
description = "GNOVI Studio -- Scientific Plotting & Visualization"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "matplotlib",
    "numpy",
    "pandas",
    "sympy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
build = ["pyinstaller"]
# arPLS baseline correction (gnovi_plot.modules.xrd.preprocessing.arpls_baseline)
# only -- everything else in modules.xrd runs on the already-core NumPy/
# SciPy/pandas stack. Kept as its own extra rather than core so a basic
# GNOVI install stays lightweight; its absence is detected at call time
# and raises a clear PybaselinesNotAvailableError, never breaks startup.
xrd = ["pybaselines"]

[tool.hatch.build.targets.wheel]
packages = ["gnovi_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
