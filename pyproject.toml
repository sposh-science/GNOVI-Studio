[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnovi-plot"
version = "0.1.0"
description = "Scientific Plotting & Analysis Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "matplotlib",
    "pandas",
    "sympy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["gnovi_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
