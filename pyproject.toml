[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnovi-plot"
version = "0.9.0"
description = "Gnovi Studio -- Scientific Plotting & Visualization"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "matplotlib",
    "pandas",
    "sympy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
build = ["pyinstaller"]

[tool.hatch.build.targets.wheel]
packages = ["gnovi_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
